[package]
name = "omnitrade-cli"
version = "0.1.0"
description = "Headless CLI runner for backtesting and automated testing"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1.3"
omnitrade-core = { path = "../omnitrade-core" }
omnitrade-engine = { path = "../omnitrade-engine" }
omnitrade-exchange = { path = "../omnitrade-exchange" }
omnitrade-risk = { path = "../omnitrade-risk" }
omnitrade-script = { path = "../omnitrade-script" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
async-trait = "0.1"
