<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omnitrade — {% block titel %}Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.12/dist/htmx.min.js" defer></script>
</head>
<body>
<nav>
  <strong style="color:var(--blue)">Omnitrade</strong>
  <a href="/" {% if seite == 'monitor' %}class="aktiv"{% endif %}>Monitor</a>
  <a href="/prognosen" {% if seite == 'prognosen' %}class="aktiv"{% endif %}>Prognosen</a>
  <a href="/steuerung" {% if seite == 'steuerung' %}class="aktiv"{% endif %}>Steuerung</a>
  <a href="/backtest" {% if seite == 'backtest' %}class="aktiv"{% endif %}>Backtest</a>
  <a href="/training" {% if seite == 'training' %}class="aktiv"{% endif %}>Training</a>
  <a href="/reparatur" {% if seite == 'reparatur' %}class="aktiv"{% endif %}>Reparatur</a>
</nav>
<main>
{% block inhalt %}{% endblock %}
</main>
</body>
</html>
