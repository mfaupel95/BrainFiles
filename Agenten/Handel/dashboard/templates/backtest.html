{% extends "basis.html" %}
{% block titel %}Backtest{% endblock %}
{% set seite = "backtest" %}
{% block inhalt %}
<h1>Backtest</h1>
<select id="spur-sel">{% for s in spuren %}<option>{{ s }}</option>{% endfor %}</select>
<input id="tage-inp" type="number" value="30" min="7" max="365" style="width:5rem;margin-left:0.5rem">
<button class="btn" id="run-btn" style="margin-left:0.5rem">Starten</button>
<pre class="log" id="log-out" style="margin-top:1rem"></pre>
<script>
document.getElementById('run-btn').addEventListener('click', function() {
  const spur = document.getElementById('spur-sel').value;
  const tage = document.getElementById('tage-inp').value;
  const log = document.getElementById('log-out');
  log.textContent = '';
  fetch('/api/backtest/run', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body: 'spur=' + encodeURIComponent(spur) + '&tage=' + encodeURIComponent(tage)})
    .then(r => { if (!r.ok) { log.textContent = 'Fehler ' + r.status; throw new Error(r.status); } })
    .then(() => {
      const es = new EventSource('/api/backtest/log/' + encodeURIComponent(spur));
      es.onmessage = e => {
        log.textContent += e.data;
        log.scrollTop = log.scrollHeight;
        if (e.data.includes('[FERTIG]')) es.close();
      };
      es.onerror = () => es.close();
    });
});
</script>
{% endblock %}
