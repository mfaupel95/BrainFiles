# Schlanke Profil-Config fuer einen Bot OHNE Repo (Coding-/Rollen-/Wartungs-Bot).
# Ersetzt die vom `hermes profile create` erzeugte Config, die einen vollen
# `providers: nous`-Modellblock (~430 Zeilen) mitbringt. Hausstandard seit
# 21.09.2026: nous/deepseek-v4-flash-0731 (der lokale Router faellt als Traeger
# aus, sobald seine Combo auf einen toten Zweig zeigt).
#
# Anwenden: Inhalt nach Agenten/Hermes/cache/scratch/ schreiben und per `cp`
# ueber profiles/<name>/config.yaml legen (write_file verweigert das
# Ueberschreiben nach einem offset/limit-Read). Danach mit
# `hermes -p <name> config get model.default` belegen, dass Hermes die YAML
# parst. terminal.cwd auf den Arbeitsordner des Bots setzen.

model:
  default: deepseek/deepseek-v4-flash-0731
  provider: nous
  base_url: https://inference-api.nousresearch.com/v1
  api_mode: chat_completions
terminal:
  cwd: C:\Users\faupe\Documents\BrainFiles
fallback_providers:
  - provider: ollama-launch
    model: qwen35-8k:cpu
    base_url: http://127.0.0.1:11434/v1
plugins:
  enabled: []
_config_version: 50
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
web:
  backend: nous
delegation:
  provider: nous
  model: deepseek/deepseek-v4-flash-0731
  fallback_providers:
    - provider: nous
      model: deepseek/deepseek-v4-flash-0731
    - provider: anthropic
      model: claude-opus-5
  child_timeout_seconds: 600
  reasoning_effort: medium
platforms:
  photon:
    enabled: false
auxiliary:
  compression:
    provider: nous
    model: deepseek/deepseek-v4-flash-0731
    timeout: 180
telemetry:
  shared_metrics:
    enabled: false
    send: false
